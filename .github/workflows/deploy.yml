name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── Build Docker Images ─────────────────────────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: docextract-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: docextract-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Push Images to GHCR ────────────────────────────────────────────────────
  push:
    name: Push images to GHCR
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to VPS ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying DocExtract ==="
            APP_DIR=/home/ubuntu/ai-document-processing
            mkdir -p "$APP_DIR"

            # First-time: clone if folder missing
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/Skalith/ai-document-processing.git "$APP_DIR"
            fi
            cd "$APP_DIR"

            git pull origin main

            # Ensure backend/.env exists (gitignored, not in git)
            if [ ! -f backend/.env ]; then
              cp backend/.env.example backend/.env
              echo "WARNING: backend/.env created from example. Put real API keys inside, then re-run deploy."
            fi

            # Ensure storage dirs exist
            mkdir -p backend/storage/uploads backend/storage/outputs logs

            docker compose up -d --build
            docker compose ps
            echo "=== Deploy complete ==="