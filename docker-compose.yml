services:
  backend:
    build: ./backend
    container_name: docextract-backend
    ports:
      - "4155:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/storage:/app/storage
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: docextract-frontend
    ports:
      - "4156:5173"
    environment:
      - VITE_API_BASE_URL=http://51.210.111.9:4155/api
    depends_on:
      - backend
    restart: unless-stopped
